# https://www.playframework.com/documentation/latest/Configuration
slick.dbs.default.profile="slick.jdbc.MySQLProfile$"
slick.dbs.default.db.driver="com.mysql.cj.jdbc.Driver"
slick.dbs.default.db.url="jdbc:mysql://localhost:3306/app?serverTimezone=UTC"
slick.dbs.default.db.user="root"
slick.dbs.default.db.password="root"

# stop CSRF for global
play.filters.csrf.header.bypassHeaders = ["Csrf-Token"]
play.filters.disabled += "play.filters.csrf.CSRFFilter"


# Support front-end cross-domain requests
play.filters.enabled += "play.filters.cors.CORSFilter"

play.filters.cors {
  allowedOrigins = ["http://localhost:3000"]
  allowedHttpMethods = ["GET", "POST", "PUT", "DELETE", "OPTIONS"]
  allowedHttpHeaders = ["Accept", "Content-Type", "X-Requested-With", "Authorization"]
}


